<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B站视频总结 · 对话</title><link rel="stylesheet" href="sidepanel.css"></head><body>
<dialog id="settings" aria-labelledby="settings-heading"><div class="settings-title"><b id="settings-heading">模型与 API</b><button id="close-settings" type="button" aria-label="关闭设置"><svg aria-hidden="true" focusable="false"
  class="lucide lucide-x"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M18 6 6 18" />
  <path d="m6 6 12 12" />
</svg></button></div><label for="provider">服务商</label><select id="provider"><option value="zhipu">智谱</option><option value="siliconflow">硅基流动</option></select><p id="model-note"></p><label for="key">API Key <span id="key-badge">未配置</span></label><input id="key" type="password" aria-label="API Key" autocomplete="off" spellcheck="false" placeholder="粘贴你的 API Key"><label for="models">可选模型</label><textarea id="models" rows="3" aria-label="可选模型" placeholder="每行填写一个模型 ID" spellcheck="false"></textarea><p class="settings-help">每行一个模型 ID，保存后可在输入框中切换。额度与价格以服务商为准。</p><div class="settings-actions"><button id="save-key">保存</button><button id="delete-key">删除 Key</button></div><p id="key-status" role="status">密钥按服务商分别保存在此浏览器，不同步。</p></dialog>
<section class="video"><h1 id="title">和视频聊一聊</h1></section>
<div id="messages" class="messages" role="log" aria-label="视频对话记录"><div id="empty"><span>✦</span><h2>重点，聊出来。</h2><p>在 B 站视频里提取字幕，<br>点击「AI 总结」即可开始。</p></div></div>
<section class="composer-area"><div id="status" role="status" aria-live="polite"></div><form id="chat-form"><textarea id="question" aria-label="追问视频内容" placeholder="继续追问这个视频…" maxlength="4000" rows="2" disabled></textarea><div class="composer-bottom"><div class="model-picker"><button id="model-toggle" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="model-menu"><span id="model-label">选择模型</span><svg aria-hidden="true" focusable="false"
  class="lucide lucide-chevron-down"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="m6 9 6 6 6-6" />
</svg></button><div id="model-menu" role="menu" aria-label="选择模型" hidden></div></div><button id="stop" type="button" aria-label="停止生成" title="停止生成" hidden><svg aria-hidden="true" focusable="false"
  class="lucide lucide-square"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <rect width="18" height="18" x="3" y="3" rx="2" />
</svg></button><button id="send" type="submit" disabled aria-label="发送问题"><svg aria-hidden="true" focusable="false"
  class="lucide lucide-arrow-up"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="m5 12 7-7 7 7" />
  <path d="M12 19V5" />
</svg></button></div></form><div class="tools" role="group" aria-label="对话操作"><button id="retry" hidden>重试</button><button id="restart" disabled><svg aria-hidden="true" focusable="false"
  class="lucide lucide-refresh-cw"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
  <path d="M21 3v5h-5" />
  <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
  <path d="M8 16H3v5" />
</svg>重新总结</button><button id="copy" disabled><svg aria-hidden="true" focusable="false"
  class="lucide lucide-copy"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
  <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
</svg>复制对话</button><button id="export" disabled><svg aria-hidden="true" focusable="false"
  class="lucide lucide-download"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
  <polyline points="7 10 12 15 17 10" />
  <line x1="12" x2="12" y1="15" y2="3" />
</svg>导出笔记</button></div></section>
<script type="module" src="sidepanel.js"></script></body></html>
